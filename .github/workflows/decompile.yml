name: Decompile FlixVision

on:
  push:
    branches: [ flixvision-decompile ]
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Download JADX
        run: |
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx-1.5.1.zip -d jadx
          chmod +x jadx/bin/jadx
          
      - name: Decompile APK (Force Deobfuscation)
        run: |
          ./jadx/bin/jadx -d decompiled --no-res --threads-count 4 --show-bad-code FLIXVISION_3.9.0.apk || true
          
      - name: Zip Decompiled Code
        run: |
          cd decompiled && zip -r ../decompiled.zip . && cd ..
          
      - name: Upload Decompiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixvision-decompiled
          path: decompiled.zip
          retention-days: 3
